# 一、潮州木雕历史沿革

## 唐宋时期（萌芽与初兴）
潮州木雕的源流可上溯至唐代。潮州自唐代起便是粤东政治文化重镇，韩愈被贬潮州时兴办教育、推广中原文化，木构建筑与神像雕刻随之传入。现存最早的潮州木雕实物多见于宋代庙宇、祠堂的建筑构件，如梁枋、斗拱、雀替上的浅浮雕纹饰。宋代潮州陶瓷与木雕并兴，木雕题材以花鸟瑞兽、佛教故事为主，线条简练，奠定了潮州木雕"构图饱满、层次分明"的雏形。

## 明代（发展与成熟）
明代是潮州木雕走向成熟的关键期。潮州商帮崛起，宗族财力雄厚，大兴祠堂、庙宇、豪宅，木雕需求激增。明代潮州木雕已形成"沉雕（阴刻）""浮雕""线雕"等技法体系，题材扩展到《三国演义》《水浒传》等历史故事，以及"八宝""博古"等吉祥纹样。代表作如潮州开元寺、海阳县学的木构装饰，刀法古朴浑厚。此期金漆木雕开始萌芽，匠人尝试在木胎上髹漆贴金。

## 清代（鼎盛与精绝）
清代康乾年间，潮州木雕达到鼎盛。这一时期技法登峰造极，尤其是"多层镂通雕"——在一块木板上层层镂空，前景、中景、背景人物分明，最复杂可达五六层。代表作"蟹篓"是潮州木雕的标志性题材：匠人以整段樟木雕出一只编织竹篓，篓内外爬满螃蟹、水草、鱼虾，蟹足篾纹纤毫毕现，镂空通透到能"穿绳而过"。清代潮州金漆木雕被广泛用于神器、屏风、轿子、床榻、馔盒，远销东南亚，"潮州金漆木雕"由此名扬海外。

## 近现代（传承与新生）
民国至建国初期，潮州木雕一度受战乱与洋货冲击而衰落。1957 年，潮州木雕老艺人张鉴轩、陈舜羌的作品在莫斯科世界青年联欢节获奖，潮州木雕重获关注。改革开放后，潮州木雕列入国家级非物质文化遗产名录（2006 年），建立了传承人制度。当代匠人在保留传统题材的同时，融入现代审美与新材料，让蟹篓、虾篓等经典作品焕发新生。

# 二、潮州木雕核心技法

## 1. 金漆木雕
金漆木雕是潮州木雕最具代表性的工艺。流程是：先在樟木上雕刻成型 → 髹涂大漆（生漆）作底 → 待漆半干时贴上金箔 → 推压使金箔牢固。成品金光灿烂、富丽堂皇，多用于祠堂神器、神龛、屏风。与福建龙眼木雕、浙江东阳木雕的"素木"风格不同，潮州木雕以"金漆"立派。

## 2. 镂空雕（多层镂通雕）
镂空雕是潮州木雕的"绝活"。匠人用钢丝锯先锯出大轮廓，再用各式刻刀层层深入。区别于一般浮雕的"二维半"层次，潮州镂通雕能做出真正的三维空间——前景人物的手可以伸到背景的窗棂后。最高难度的"五层镂通"，每一层都要兼顾构图与结构强度，稍有不慎整件作品报废。

## 3. 浮雕
浮雕分浅浮雕（1-3 毫米）与深浮雕（半立体）。潮州木雕的浮雕擅长"压缩透视"，把远景人物缩小、近景放大，在有限厚度里营造深远感。常用于梁枋、门裙板等大面积平面装饰。

## 4. 蟹篓镂空技法（招牌绝技）
蟹篓是潮州木雕的"招牌"。技法要点：
- 选材：用整段香樟木，木质细密有韧性，不易断篾。
- 镂篓：先用钻与锯掏空内部，再雕出编织纹路（"篾片"交织），篾纹要符合真实竹编的"压一挑一"规律。
- 雕蟹：螃蟹的八足两螯要分别镂出，关节、蟹壳质感分明，蟹足穿过篾孔"探出"，营造"蟹欲逃、人未捉"的瞬间。
- 配景：篓外加水草、鱼虾、浪花，动势呼应。
蟹篓寓意"八方来财、富甲一方"，是潮汕商人厅堂必备摆件。

## 5. 沉雕（阴刻）与线雕
沉雕是刻去纹样轮廓形成凹槽，常用于匾额、楹联；线雕以单线刻画，纤细流畅，多用于小品。

# 三、代表传承人群体

## 张鉴轩（1918-1986）
潮州木雕一代宗师，被誉为"潮州木雕状元"。代表作《蟹篓》在 1957 年莫斯科世界青年联欢节获铜奖，是潮州木雕首次国际获奖。他擅长在整段樟木上镂通雕蟹篓，开创了"立体蟹篓"范式。

## 陈舜羌（1920-2000）
与张鉴轩齐名，国家级非遗代表性传承人。代表作《龙虾蟹篓》将龙虾引入蟹篓题材，丰富了海洋元素。其子陈培臣继承家学，亦为国家级传承人。

## 陈培臣
陈舜羌之子，国家级非遗代表性传承人。作品《清明上河图》木雕局部以多层镂通再现汴京繁华，被誉为"刀下《清明上河图》"。

## 李得浓
国家级非遗代表性传承人，广东省工艺美术大师。擅长金漆木雕屏风与神器，作品构图繁复、刀法精到。

## 辜柳希
国家级非遗代表性传承人，潮州木雕艺术研究院院长。致力于大型木雕与人才培养，推动潮州木雕走进高校与展览。

## 庄春潮
省级代表性传承人，擅长虾篓、鱼篓题材，刀法灵动，作品多次获国家级金奖。

# 四、工具与材料

## 木材
- 香樟木：潮州木雕首选。木质细密、含樟脑香气、防虫耐腐、韧性佳，适合多层镂通。
- 杉木：用于建筑构件大件，质轻价廉。
- 龙眼木、檀木：用于精细小品。

## 漆与金箔
- 大漆（生漆）：从漆树割取的天然漆，髹涂后形成坚韧漆膜，是贴金的底。
- 金箔：纯金捶打成 0.1 微米厚的薄片，一张仅指甲盖大却金光夺目。贴金需在漆"将干未干"时进行，时机稍纵即逝。

## 雕刻工具
- 钢丝锯（剜锯）：用于镂空下料。
- 平口刀、圆口刀、三角刀、斜口刀：各式刻刀，分别负责不同纹理。
- 木槌：敲击刻刀深挖。
- 弯刀：用于蟹篓内壁、篾孔反手雕刻。

# 五、潮州木雕的文化价值

潮州木雕不只是工艺，更是潮汕文化的活态载体：
- 宗族文化：祠堂神器、神龛、屏风上的木雕承载潮汕人对祖先与神明的敬畏。
- 海洋文化：蟹篓、虾篓、海产题材折射潮汕人"向海而生"的生活。
- 商帮文化：金漆辉煌的木雕彰显潮商"重面子、讲排场"的审美。
- 华侨纽带：潮州金漆木雕随华侨远播东南亚，是海外潮人乡愁的寄托。

  /* ============================================================

  /* ============================================================

  /* ============================================================
   * 【H 区】Canvas淡鎏金粒子系统
   * ------------------------------------------------------------
   * 这一段在干什么：在背景层画18个淡金色粒子，缓慢向上飘浮，营造国风雅致感
   * 人话讲：像空气里飘着细碎的金粉，很淡很柔，不抢文字风头
   * 新手易错点：
   *   1. Canvas必须设置width/height属性（不是CSS宽高），否则模糊
   *   2. requestAnimationFrame递归调用才能持续动画
   *   3. 粒子超出边界要重置，否则粒子飘完就没了
   *   4. 粒子透明度调低到0.1-0.3，颜色用淡鎏金色
   * ============================================================ */
  const particles = [];
  const PARTICLE_COUNT = 18;  // 粒子数量减少到18个
  let ctx = null;

  function initParticles() {
    if (!particleCanvas) return;
    ctx = particleCanvas.getContext('2d');
    if (!ctx) return;

    // 设置Canvas实际像素尺寸（适配高DPI屏幕）
    function resizeCanvas() {
      const rect = particleCanvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      particleCanvas.width = rect.width * dpr;
      particleCanvas.height = rect.height * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 初始化粒子
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(createParticle(true));
    }

    // 启动动画循环
    animateParticles();
  }

  // 创建一个粒子（initial=true表示初始随机位置，false从底部重置）
  function createParticle(initial) {
    const rect = particleCanvas.getBoundingClientRect();
    const isLarge = Math.random() < 0.15; // 15%概率是大粒子（金屑）
    return {
      x: Math.random() * rect.width,
      y: initial ? Math.random() * rect.height : rect.height + Math.random() * 80,
      vx: (Math.random() - 0.5) * 0.2,
      vy: 0.1 + Math.random() * 0.3,
      size: isLarge ? (2 + Math.random() * 2) : (1 + Math.random() * 1.5),
      alpha: isLarge ? (0.1 + Math.random() * 0.2) : (0.08 + Math.random() * 0.15),  // 透明度降到0.1-0.3
      life: 0.4 + Math.random() * 0.6,
      isLarge: isLarge
    };
  }

  // 粒子动画主循环
  function animateParticles() {
    if (!ctx) return;
    const rect = particleCanvas.getBoundingClientRect();

    // 清空画布
    ctx.clearRect(0, 0, rect.width, rect.height);

    // 更新并绘制每个粒子
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // 更新位置
      p.x += p.vx;
      p.y -= p.vy;
      p.life -= 0.0015;
      p.alpha = Math.max(0, p.life * (p.isLarge ? 0.25 : 0.2));

      // 超出顶部或生命周期结束，重置到底部
      if (p.y < -10 || p.life <= 0) {
        particles[i] = createParticle(false);
        continue;
      }

      // 绘制粒子：淡鎏金色(rgba(212,175,55,alpha))
      if (p.isLarge && p.size > 2.5) {
        // 大粒子加柔光
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212,175,55,${p.alpha * 0.3})`;
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212,175,55,${p.alpha})`;
      ctx.fill();
    }

    // 下一帧继续
    requestAnimationFrame(animateParticles);
  }

  // 启动粒子系统
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initParticles);
  } else {
    initParticles();
  }


  /* ============================================================
   * 【C 区】Web Speech API ASR 语音识别（长按录音）
   * ------------------------------------------------------------
   * 这一段在干什么：用浏览器自带的语音识别（ASR）把用户说的话实时转成文字。
   * 什么是 ASR：Automatic Speech Recognition，自动语音识别。
   *   人话讲：就是"语音转文字"，类似微信语音转文字功能。
   * 什么是 Web Speech API：浏览器内置的一套语音能力接口，免装 SDK。
   *   人话讲：浏览器自带的"耳朵"，不用接百度/讯飞也能识别。
   * 兼容性：Chrome 用 webkitSpeechRecognition，部分浏览器（Firefox/Safari 部分版本）不支持。
   * 新手易错点：SpeechRecognition 是异步的——start() 后不会立刻拿到结果，
   *   文字在 onresult 回调里才出现；连续点两次 start() 会抛 InvalidStateError。
   *   验证：长按按钮后说话，控制台看 onresult 是否打印出 transcript 文本。
   * ============================================================ */

  // 兼容写法：Chrome 是 webkitSpeechRecognition，标准是 SpeechRecognition，谁有就用谁
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;     // 识别实例（不支持时保持 null）
  let isRecording = false;    // 当前是否在录音（用标志位防止重复 start）

  // 浏览器不支持语音识别时，显示常驻提示条
  //   原因：原代码只在用户"按下按钮"时才弹提示，用户根本不知道按了没用；
  //     a11y/UX 要求一进页面就告诉用户"你这浏览器不行"，别让人白按。
  //   人话讲：在门口立个牌子"本店暂不支持某服务"，比让客人进去问一圈强。
  //   新手易错点：
  //     1. 必须在创建 SpeechRecognition 实例之前判断，避免后续 new 抛错；
  //     2. 提示条用内联 style 写死，不依赖外部 CSS，保证提示在任何环境都能显示；
  //     3. 文字用 textContent 设，防 XSS。
  //   验证：在不支持的浏览器（如老版 Firefox）打开页面，应看到录音按钮上方有常驻提示条。
  if (!SpeechRecognition) {
    const tip = document.createElement('div');
    tip.className = 'voice-unsupported-tip';
    tip.textContent = '当前浏览器不支持语音对话，建议使用 Chrome / Edge 体验完整功能';
    document.body.appendChild(tip);
  }

  // 本轮识别是否拿到过结果的标志位。
  // 人话讲：每次按下录音前把它拨回 false，onresult 拿到字了就拨到 true；
  //   onend 时看它还是 false，说明用户按了一下但啥都没说，给个友好提示。
  let hasResultThisRound = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';        // 识别简体中文
    recognition.continuous = false;    // 单次模式：用户说完一段就停（松手即停）
    recognition.interimResults = false; // 只要最终结果，不要中间临时文本（省渲染）

    // onresult：识别结果回调。event.results 是个类数组，[0][0].transcript 就是第一句识别文本
    recognition.onresult = function (event) {
      // 拿到结果，标志位置 true，让 onend 知道本轮"有事发生"
      hasResultThisRound = true;
      // transcript 可能是 undefined/空串/全空白，必须 trim 后兜底为空串再校验。
      //   人话讲：识别引擎偶尔会返回空字符串，不校验就把"啥也没说"当问题发给 AI 了。
      //   新手易错点：直接用 event.results[0][0].transcript，万一为 undefined 后续 .length 直接抛错。
      const text = (event.results[0][0].transcript || '').trim();
      // 只打印长度不打印内容，避免用户语音内容残留在控制台
      console.log('识别到文本长度：', text.length);
      // 空内容直接友好提示并 return，别把空字符串发给 DeepSeek
      if (!text) {
        addBubble('没听清内容，请再试一次。', 'ai');
        return;
      }
      // 超长输入拒绝，避免上下文爆炸 + 浪费 token
      if (text.length > 200) {
        addBubble('问题太长啦，请简短一些～', 'ai');
        return;
      }
      requestAiPrivacyConsent(text);
    };

    // onend 是识别会话结束（无论有没有结果都会触发）。
    //   若本轮 hasResultThisRound 还是 false，说明用户按了录音但没说出可识别的字，
    //   此时给个友好提示并清理录音状态，避免按钮卡在 recording 态。
    //   人话讲：演员没台词也得让幕布拉上，别让观众干等。
    //   新手易错点：onend 必须重置标志位，否则下一轮"按了没说"会误判成"说过话"。
    recognition.onend = function () {
      if (!hasResultThisRound) {
        addBubble('没听到您说什么，请再长按试一次。', 'ai');
      }
      hasResultThisRound = false;
      // 清理录音状态：万一 onresult 没走（用户没说话），按钮也得复位
      isRecording = false;
      recordBtn.classList.remove('record-btn--recording');
    };

    // onerror：识别出错（如没麦克风权限、网络断）时回调
    recognition.onerror = function (event) {
      // event.error 是字符串错误码（如 'not-allowed'），不涉及用户数据，可保留
      console.error('语音识别出错：', event.error);
      // 出错时也算"已处理"，避免 onend 再额外弹"没听到您说什么"
      hasResultThisRound = true;
      addBubble('抱歉，我没听清，请再长按试一次。', 'ai');
    };
  }


  /* ============================================================
   * 长按录音/点击发送事件绑定（touch + mouse + keyboard 三轨）
   * ------------------------------------------------------------
   * 这一段在干什么：
   *   - 输入框有文字时：按钮是发送模式，点击发送文字
   *   - 输入框无文字时：按钮是语音模式，长按录音，松开发送
   * 人话讲：跟微信一样，有字就显示发送按钮，没字就显示麦克风
   * 新手易错点：
   *   1. touchstart 要 preventDefault，否则会触发 click 还会双倍触发 mousedown
   *   2. 发送模式下要阻止录音逻辑触发
   *   3. 键盘支持：Enter发送文字，空格长按录音
   * ============================================================ */

  // 更新按钮状态：根据输入框内容切换麦克风/发送图标
  function updateBtnMode() {
    const text = chatInput.value.trim();
    if (text) {
      // 有文字：发送模式
      isSendMode = true;
      recordBtn.classList.add('record-btn--send');
      micIcon.style.display = 'none';
      sendIcon.style.display = 'block';
      recordBtn.setAttribute('aria-label', '发送消息');
    } else {
      // 无文字：语音模式
      isSendMode = false;
      recordBtn.classList.remove('record-btn--send');
      micIcon.style.display = 'block';
      sendIcon.style.display = 'none';
      recordBtn.setAttribute('aria-label', '长按语音输入');
    }
  }

  // 发送文字消息
  function sendTextMessage() {
    const text = chatInput.value.trim();
    if (!text || isAiBusy) return;
    requestAiPrivacyConsent(text);
  }

  function requestAiPrivacyConsent(text) {
    if (localStorage.getItem(AI_PRIVACY_CONSENT_KEY) === 'accepted') {
      submitTextMessage(text);
      return;
    }
    pendingAiMessage = text;
    aiPrivacyDialog.classList.add('ai-privacy-dialog--open');
    aiPrivacyDialog.setAttribute('aria-hidden', 'false');
    aiPrivacyConfirm.focus();
  }

  aiPrivacyConfirm.addEventListener('click', function() {
    const text = pendingAiMessage;
    pendingAiMessage = '';
    localStorage.setItem(AI_PRIVACY_CONSENT_KEY, 'accepted');
    aiPrivacyDialog.classList.remove('ai-privacy-dialog--open');
    aiPrivacyDialog.setAttribute('aria-hidden', 'true');
    if (text) submitTextMessage(text);
  });

  aiPrivacyCancel.addEventListener('click', function() {
    pendingAiMessage = '';
    aiPrivacyDialog.classList.remove('ai-privacy-dialog--open');
    aiPrivacyDialog.setAttribute('aria-hidden', 'true');
    addBubble('已取消发送。请避免输入敏感个人信息后再试。', 'ai');
    chatInput.focus();
  });

  aiPrivacyDialog.addEventListener('click', function(e) {
    if (e.target === aiPrivacyDialog) aiPrivacyCancel.click();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && aiPrivacyDialog.getAttribute('aria-hidden') === 'false') {
      aiPrivacyCancel.click();
    }
  });

  // 用户首次发送前确认数据会交给 AI 服务处理；确认一次后仅保存在当前浏览器。
  function submitTextMessage(text) {
    if (isAiBusy) return;
    isAiBusy = true;
    chatBox.setAttribute('aria-busy', 'true');
    recordBtn.disabled = true;
    chatInput.disabled = true;
    imageBtn.disabled = true;
    // 隐藏话题卡片（如果还在）
    hideTopics();
    // 添加用户气泡
    addBubble(text, 'user');
    // 清空输入框
    chatInput.value = '';
    // 更新按钮状态
    updateBtnMode();
    // 调用AI
    callDeepSeek(text);
  }

  // 开始录音
  function startRecord(event) {
    // 如果是发送模式，不录音，等click触发发送
    if (isSendMode) return;
    event.preventDefault(); // 阻止默认行为（如鼠标选中文字、触发 click）
    if (!recognition) {
      // 浏览器不支持，给用户降级提示
      addBubble('当前浏览器不支持语音识别，请使用 Chrome 浏览器体验语音对话功能。', 'ai');
      return;
    }
    if (isRecording) return; // 已在录音，不重复 start
    isRecording = true;
    // 加 --recording 类：按钮放大 + 启动波纹动画（CSS 控制）
    recordBtn.classList.add('record-btn--recording');
    try {
      recognition.start(); // 异步开始监听，结果在 onresult
      console.log('开始录音...'); // 验证：控制台应打印
    } catch (err) {
      // 新手易错点：上一次未结束时再 start 会抛 InvalidStateError，这里兜底
      console.warn('recognition.start 失败：', err);
      isRecording = false;
      recordBtn.classList.remove('record-btn--recording');
    }
  }

  // 停止录音
  function stopRecord() {
    // 如果是发送模式，不处理停止录音
    if (isSendMode) return;
    if (!isRecording) return; // 没在录音就不停
    isRecording = false;
    // 移除 --recording 类：按钮复位 + 波纹停止
    recordBtn.classList.remove('record-btn--recording');
    if (recognition) {
      try {
        recognition.stop(); // stop() 会触发 onresult（如果有最终结果）
      } catch (err) {
        console.warn('recognition.stop 失败：', err);
      }
    }
  }

  // 绑定输入框事件：实时更新按钮状态
  chatInput.addEventListener('input', updateBtnMode);
  // Enter键发送
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendTextMessage();
    }
  });

  // 绑定按钮事件：手机 touch + 电脑 mouse 都要覆盖
  // 新手易错点：passive:false 才能 preventDefault
  recordBtn.addEventListener('touchstart', startRecord, { passive: false });
  recordBtn.addEventListener('mousedown', startRecord);
  recordBtn.addEventListener('touchend', function(e) {
    if (isSendMode) return;
    stopRecord();
  });
  recordBtn.addEventListener('mouseup', function(e) {
    if (isSendMode) return;
    stopRecord();
  });
  recordBtn.addEventListener('mouseleave', function(e) {
    if (isSendMode) return;
    stopRecord();
  });

  // 点击事件：发送模式下点击发送文字
  recordBtn.addEventListener('click', function(e) {
    if (isSendMode) {
      e.preventDefault();
      sendTextMessage();
    }
  });

  // 键盘无障碍支持
  // 原因：只绑了 touch/mouse，键盘用户（用 Tab 聚焦到按钮的人）完全无法触发。
  //   a11y 要求：所有鼠标能做的事，键盘也得能做。
  // 人话讲：给按钮加个"空格/回车也能按"的开关，让不用鼠标的人也能跟 AI 对话。
  // 新手易错点：空格键默认会滚动页面，必须 preventDefault 才能"占用"它
  recordBtn.addEventListener('keydown', function (e) {
    if (e.key === ' ') {
      e.preventDefault();
      if (isSendMode) {
        sendTextMessage();
      } else {
        startRecord(e);
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (isSendMode) {
        sendTextMessage();
      }
    }
  });
  recordBtn.addEventListener('keyup', function (e) {
    if (e.key === ' ' && !isSendMode) {
      stopRecord();
    }
  });

  // 输入框聚焦时滚动到可见位置（键盘弹出适配）
  chatInput.addEventListener('focus', function() {
    setTimeout(() => {
      chatInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 300);
  });


  /* ============================================================
   * 【I 区】图片上传功能
   * ------------------------------------------------------------
   * 这一段在干什么：点击图片按钮→选择图片→预览→发送（目前是模拟识别）
   * 人话讲：用户可以上传木雕图片，AI会介绍相关知识
   * 新手易错点：
   *   1. FileReader是异步的，要在onload里才能拿到DataURL
   *   2. 图片预览要revokeObjectURL避免内存泄漏（这里用DataURL不用）
   *   3. 点击图片气泡弹出大图预览
   * ============================================================ */

  // 图片按钮点击→触发文件选择
  imageBtn.addEventListener('click', function() {
    imageUpload.click();
  });

  // 文件选择后处理
  imageUpload.addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    // 新手易错点：必须检查文件类型，防止用户传非图片
    if (!file.type.startsWith('image/')) {
      addBubble('请选择图片文件哦~', 'ai');
      return;
    }

    // 读取文件为DataURL
    const reader = new FileReader();
    reader.onload = function(event) {
      const dataUrl = event.target.result;
      // 隐藏话题卡片
      hideTopics();
      // 添加图片气泡
      addImageBubble(dataUrl);
      // 添加AI提示
      setTimeout(() => {
        addBubble('图片识别功能即将上线，先给您讲讲相关知识吧~', 'ai');
        requestAiPrivacyConsent('用户上传了一张木雕相关图片，请介绍潮州木雕的一个经典技法');
      }, 300);
    };
    reader.onerror = function() {
      addBubble('图片读取失败，请再试一次~', 'ai');
    };
    reader.readAsDataURL(file);

    // 清空input value，否则下次选同一张图不会触发change
    imageUpload.value = '';
  });

  // 添加图片气泡
  function addImageBubble(dataUrl) {
    const bubble = document.createElement('div');
    bubble.className = 'chat__bubble chat__bubble--image';
    const img = document.createElement('img');
    img.src = dataUrl;
    img.alt = '用户上传的图片';
    // 点击图片弹出预览
    img.addEventListener('click', function(e) {
      e.stopPropagation();
      previewImg.src = dataUrl;
      imagePreview.style.display = 'flex';
    });
    bubble.appendChild(img);
    chatBox.appendChild(bubble);
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble;
  }


  /* ============================================================
   * 【气泡渲染工具】往对话区塞一条新气泡
   * ------------------------------------------------------------
   * 这一段在干什么：根据 type（ai/user/thinking/image）创建对应样式的气泡，
   *   追加到对话区，并自动滚到底部，让用户看到最新消息。
   * 数据流：文字 text + 类型 type → 创建 div → 加类名 → 追加到 chatBox → 滚动到底
   * 支持类型：
   *   - 'ai'：AI消息（白底+鎏金边框，带头像）
   *   - 'user'：用户消息（朱砂红，右侧）
   *   - 'thinking'：思考中（三个鎏金圆点跳动）
   * ============================================================ */
  function addBubble(text, type) {
    const bubble = document.createElement('div');

    if (type === 'thinking') {
      // 思考气泡：三点跳动+文字
      bubble.className = 'chat__bubble chat__bubble--thinking';
      const dots = document.createElement('div');
      dots.className = 'thinking-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      const textSpan = document.createElement('span');
      textSpan.className = 'thinking-text';
      textSpan.textContent = text || '正在思考...';
      bubble.appendChild(dots);
      bubble.appendChild(textSpan);
    } else {
      // 普通气泡
      bubble.className = 'chat__bubble chat__bubble--' + type;

      if (type === 'ai') {
        // AI气泡：用文本节点放文字，后面追加AIGC标签
        // 新手易错点：用文本节点而不是innerHTML，防XSS；也方便后面替换文字
        const textNode = document.createTextNode(text);
        bubble.appendChild(textNode);
        // AIGC标签（合规要求：AI生成内容需显式标识）
        const aigcTag = document.createElement('span');
        aigcTag.className = 'aigc-tag';
        aigcTag.textContent = 'AIGC';
        bubble.appendChild(aigcTag);
      } else {
        // 用户气泡：直接放文字
        bubble.textContent = text;
      }
    }

    chatBox.appendChild(bubble);
    // 滚动到底：让最新气泡进入可视区
    chatBox.scrollTop = chatBox.scrollHeight;
    return bubble; // 返回引用，方便后面改文字（如把"思考中"换成最终回复）
  }

  // 显示思考指示器，返回引用
  function showThinking() {
    console.log('[AI] 显示思考指示器');
    return addBubble('正在思考...', 'thinking');
  }

  // 隐藏思考指示器，替换为AI回复
  function hideThinking(thinkingBubble, replyText) {
    if (!thinkingBubble || !thinkingBubble.parentNode) return;
    // 创建新的AI气泡替换思考气泡
    const newBubble = addBubble(replyText, 'ai');
    // 移除思考气泡
    thinkingBubble.parentNode.removeChild(thinkingBubble);
    return newBubble;
  }


  /* ============================================================
   * 【D 区】DeepSeek API 调用（重点）
   * ------------------------------------------------------------
   * 这一段在干什么：把用户问题 + 系统提示词打包发给 DeepSeek，拿回 AI 回复。
   * 人话讲：fetch 就像"打电话"——你按号码（URL）、报身份（headers 带 key）、
   *   说内容（body 里塞 messages），等对方回话（await res.json()）。
   * 什么是 API 调用：应用程序接口调用，让前端请求远端服务拿数据。
   *   人话讲：去窗口办事，按规范填表交材料，办事员给你回执。
   * 新手易错点：
   *   1. fetch 是异步的，必须 await，否则 data 是 Promise 不是数据；
   *   2. 返回结构在 data.reply，写错路径会拿到 undefined；
   *   3. 服务端未配置密钥时会返回 503，网络异常或超时时会进入本地兜底话术。
   *   验证：F12 Network 查看 /api/chat 请求状态与响应体中的 reply 字段。
   * ============================================================ */
  async function callDeepSeek(userText) {
    // 1. 先同步显示"思考中"气泡（确保DOM先渲染出来，不被任何异步逻辑跳过）
    const thinkingBubble = showThinking();
    console.log('[AI] 思考气泡已添加到DOM，isConnected=', thinkingBubble.isConnected);

    // 强制浏览器重绘一帧，确保用户能看到思考气泡
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    // 未配置Key：直接使用本地回复（不发网络请求），但至少显示1.5秒思考状态
    const MIN_THINKING_MS = 1200;
    const startTime = Date.now();

    // AbortController + 15 秒超时
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);

    try {
      const res = await fetch(AI_PROXY_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
          // 认证由边缘函数 /api/chat 在服务端用 DEEPSEEK_API_KEY 环境变量完成，浏览器不携带 key
        },
        body: JSON.stringify({ message: userText }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!res.ok) {
        const apiError = new Error('API 响应错误：HTTP ' + res.status);
        apiError.status = res.status;
        throw apiError;
      }

      const data = await res.json();

      if (!data || typeof data.reply !== 'string') {
        throw new Error('DeepSeek 返回数据结构异常');
      }
      const aiReply = data.reply;
      if (typeof aiReply !== 'string' || !aiReply.trim()) {
        throw new Error('AI 回复内容为空');
      }

      console.log('AI 回复长度：', aiReply.length);
      const safeReply = aiReply.length > 500 ? aiReply.slice(0, 500) + '...' : aiReply;

      const elapsed2 = Date.now() - startTime;
      await new Promise(r => setTimeout(r, Math.max(0, MIN_THINKING_MS - elapsed2)));
      hideThinking(thinkingBubble, safeReply);
      speak(safeReply);

    } catch (err) {
      clearTimeout(timeoutId);
      console.warn('DeepSeek 调用失败：', err.name);

      const elapsed3 = Date.now() - startTime;
      await new Promise(r => setTimeout(r, Math.max(0, MIN_THINKING_MS - elapsed3)));

      if (err.name === 'AbortError') {
        hideThinking(thinkingBubble, '抱歉，AI思考时间有点长，请再试一次。');
        return;
      }

      if (err.status === 503) {
        hideThinking(thinkingBubble, 'AI 服务还没有完成配置，请联系项目维护者。');
        return;
      }

      const fallback = '这个问题我暂时还未深入了解，不妨让我给您讲讲潮州木雕最经典的螃蟹篓镂空技法吧。匠人以整段香樟木层层镂通，雕出编织篾纹与穿篾而过的螃蟹，蟹足纤毫毕现，寓意八方来财、富甲一方。';
      hideThinking(thinkingBubble, fallback);
      speak(fallback);
    } finally {
      isAiBusy = false;
      chatBox.setAttribute('aria-busy', 'false');
      recordBtn.disabled = false;
      chatInput.disabled = false;
      imageBtn.disabled = false;
      updateBtnMode();
      chatInput.focus();
    }
  }


  /* ============================================================
   * 【E 区】TTS 语音合成 + 数字人说话动画
   * ------------------------------------------------------------
   * 这一段在干什么：把 AI 回复的文字用浏览器自带朗读功能念出来，
   *   朗读开始时给数字人加 .ai-avatar--speaking 类触发光晕动画，结束时移除。
   * 什么是 TTS：Text-To-Speech，文本转语音。
   *   人话讲：把字念给你听，类似手机"朗读屏幕"功能。
   * 什么是 speechSynthesis：浏览器内置的语音合成引擎，不用装插件。
   * 什么是 SpeechSynthesisUtterance：一段要朗读的"话语对象"，可以设语种、语速、音调。
   * 新手易错点：
   *   1. speechSynthesis 需用户交互后才能触发（浏览器策略），长按录音/点击已满足；
   *   2. 连续朗读要先 cancel() 旧的，否则会排队重叠播放；
   *   3. onend 一定要移除 --speaking 类，否则数字人会一直"发光"卡住。
   *   验证：AI 回复时应听到朗读声 + 数字人金色光晕加强；念完应恢复。
   * ============================================================ */
  function speak(text) {
    // 浏览器不支持语音合成，直接返回（不报错、不影响文字气泡）
    if (!('speechSynthesis' in window)) {
      console.warn('当前浏览器不支持语音合成（TTS），仅显示文字。');
      return;
    }

    // cancel 之前先主动移除一次说话类。
    // 原因：部分浏览器（如旧版 Chrome）调用 speechSynthesis.cancel() 只触发 utterance.oncancel，
    //   不一定触发 onend；如果只靠 onend 收尾，数字人就会卡在发光状态。
    // 人话讲：在踢掉上一段录音前，先把演员的"光效"手动关掉，别等系统回调，万一不回调就露馅了。
    // 新手易错点：onend 不可靠，必须主动 + oncancel 双保险收尾。
    digitalHuman.classList.remove('ai-avatar--speaking');

    // 先取消上一次未念完的，避免排队堆叠
    window.speechSynthesis.cancel();

    // 创建一段"话语"
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN'; // 中文语音
    utterance.rate = 1;       // 语速 1.0 = 正常，1.5 = 1.5 倍速
    utterance.pitch = 1;      // 音调 1.0 = 正常

    // 朗读开始：给数字人加 --speaking 类 → CSS 触发光晕增强+快速浮动
    utterance.onstart = function () {
      console.log('开始朗读，数字人说话'); // 验证
      digitalHuman.classList.add('ai-avatar--speaking');
    };

    // 朗读结束/被打断：移除 --speaking 类 → 动画停止，数字人恢复正常
    utterance.onend = function () {
      console.log('朗读结束，数字人安静'); // 验证
      digitalHuman.classList.remove('ai-avatar--speaking');
    };

    // oncancel 监听。
    // 原因：cancel() 在部分浏览器只触发 oncancel 不触发 onend，
    //   只监听 onend 会导致 cancel 后数字人卡在发光状态。
    // 人话讲：onend 是"正常谢幕"，oncancel 是"被轰下台"，两种退场都得收拾道具。
    utterance.oncancel = function () {
      console.log('朗读被取消，数字人安静'); // 验证
      digitalHuman.classList.remove('ai-avatar--speaking');
    };

    // 朗读出错：也要移除类，避免卡在发光态
    utterance.onerror = function () {
      digitalHuman.classList.remove('ai-avatar--speaking');
    };

    // 正式提交给浏览器朗读
    window.speechSynthesis.speak(utterance);
  }


  /* ============================================================
   * 【G 区】页面生命周期清理（beforeunload + visibilitychange）
   * ------------------------------------------------------------
   * 这一段在干什么：用户关页面/切后台时，主动停掉录音和朗读，避免资源泄漏
   *   和后台继续念经的尴尬。
   * 人话讲：演员下班前要卸妆关灯，不能让观众走了舞台还在演。
   * 新手易错点：
   *   1. recognition.stop() 在未启动时调用会抛错，必须 try-catch 兜底；
   *   2. speechSynthesis 在某些浏览器切到后台会自动暂停但不一定取消，需手动 cancel。
   *   验证：朗读中切到别的 Tab，应立刻听不到声音、数字人停止发光。
   * ============================================================ */

  // 页面卸载前清理资源。
  //   人话讲：用户要关页了，赶紧把麦克风和喇叭都关掉，别留尾巴。
  window.addEventListener('beforeunload', function () {
    if (recognition) {
      try { recognition.stop(); } catch (e) { /* 已停或未启动，忽略 */ }
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      digitalHuman.classList.remove('ai-avatar--speaking');
    }
  });

  // 页面被切到后台（如切 Tab、最小化）时清理朗读。
  //   原因：移动端浏览器切后台后 TTS 可能继续在后台念，体验差且耗电；
  //   document.hidden 为 true 表示页面已不可见。
  //   人话讲：观众都走光了，舞台就别再演了。
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      digitalHuman.classList.remove('ai-avatar--speaking');
    }
  });

  // 控制台欢迎语，方便调试时确认脚本已正常执行
  console.log('潮州木雕 AI 数字人页面脚本已加载完毕（仿古宣纸米白版）。');
  </script>
</body>
</html>
