<!DOCTYPE html>
<!--
  这个文件是：潮州木雕·数智非遗传承 H5 网站 → 传承页 (inherit.html)
  在干什么：用横向匠人卡片 + 固定金线标注 + 年轮互动弹窗，
            传递"致敬所有长久坚持"的精神共鸣。
  架构：MPA 多页面，底部固定导航栏，内嵌 CSS + Vanilla JS。
  v2 更新：移除了视差长卷层，改为固定标注+金线；卡片改为错落焦点布局；按钮改为牙白实心底。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="认识潮州木雕传承人的技艺与故事，并通过年轮镌刻互动留下自己的坚持。">
  <title>传承 · 潮州木雕</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/inherit.css">
</head>
<body>
  <!--
    .inherit-page：传承页根容器
    默认浅色宣纸模式，点月亮按钮可切换深色模式。
  -->
  <div class="inherit-page" id="inheritPage">

    <!-- ===== 1. 固定顶部控件（右上角月亮） ===== -->
    <div class="inherit-top-controls">
      <!-- 月亮按钮：明暗模式切换 -->
      <button class="inherit-top-btn" id="darkModeBtn" aria-label="切换明暗模式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <!-- ===== 2. 页面顶部标题区 ===== -->
    <div class="inherit-title-area">
      <h1 class="inherit-title">传承</h1>
      <p class="inherit-subtitle">以刀刻木，以心守艺</p>
      <p class="inherit-note">注：匠人生平资料搜集自公开文献与网络素材，若存在信息疏漏，欢迎指正</p>
    </div>

    <!-- ===== 3. 横向滚动匠人卡片容器 ===== -->
    <section class="inherit-cards-section" id="cardsSection" aria-label="匠人卡片">
      <div class="inherit-cards-scroll inherit-cards-scroll--init" id="cardsScroll">
        <!-- JS 动态渲染 4 张卡片 -->
      </div>
    </section>

    <!-- ===== 4. 时间轴（金线 + 初学/经年/承艺，正常文档流）=====
         人话讲：放在卡片和过渡文字之间，用 flex 纵向排列，
         不再用 vh 绝对定位，彻底解决不同屏幕上文字重叠问题。 -->
    <div class="inherit-timeline">
      <p class="inherit-label">初学</p>
      <div class="inherit-gold-line"></div>
      <p class="inherit-label">经年</p>
      <div class="inherit-gold-line"></div>
      <p class="inherit-label">承艺</p>
    </div>

    <!-- 旧的绝对定位标注层（保留元素供 JS 引用，但 CSS 已设 display:none 隐藏） -->
    <div class="inherit-overlay" id="parallaxOverlay"></div>

    <!-- ===== 5. 过渡导语 ===== -->
    <div class="inherit-transition-text">
      匠人数十年与木相伴，在木纹刻下<span class="inherit-text-highlight">初学</span>、<span class="inherit-text-highlight">经年</span>、<span class="inherit-text-highlight">承艺</span>的痕迹。<br>
      你亦奔赴属于自己的漫长时光，不妨刻下你的坚持。
    </div>

    <!-- ===== 6. 底部并排双圆角按钮 ===== -->
    <div class="inherit-actions">
      <button class="inherit-action-btn" id="btnViewMasters">匠语漫行</button>
      <button class="inherit-action-btn" id="btnMyPersistence">刻下我的坚持</button>
    </div>

    <!-- ===== 7. 匠人详情弹窗（Modal） ===== -->
    <div class="inherit-modal" id="masterModal" role="dialog" aria-modal="true" aria-labelledby="modalName" aria-hidden="true">
      <div class="inherit-modal__panel">
        <button class="inherit-modal__close" id="modalClose" aria-label="关闭">×</button>
        <div id="modalAvatarWrap"></div>
        <h3 class="inherit-modal__name" id="modalName"></h3>
        <span class="inherit-modal__level" id="modalLevel"></span>
        <p class="inherit-modal__story" id="modalStory"></p>
      </div>
    </div>

    <!-- ===== 8. 冷门小故事气泡（长按彩蛋） ===== -->
    <div class="inherit-trivia" id="triviaBubble" aria-hidden="true"></div>

    <!-- ===== 9. 年轮互动弹窗（v3 重制版：木板镌刻 + 宣纸输入 + 一键/手动双模式）===== -->
    <!-- 人话讲：点击"刻下我的坚持"从底部滑入全屏弹窗
         包含：木板年轮图 + SVG鎏金轨迹 + 宣纸输入框 + 双按钮（一键/手动镌刻）
         完成后显示守心印章 + 分享文案 + 保存/复制/返回三按钮 -->
    <div class="inherit-ring-modal ring-modal--state-start" id="ringModal" role="dialog" aria-modal="true" aria-labelledby="ringModalTitle" aria-hidden="true">
      <div class="inherit-ring-modal__overlay" id="ringOverlay"></div>
      <div class="inherit-ring-modal__panel" id="ringPanel">
        <!-- 右上角关闭按钮 -->
        <button class="inherit-ring-modal__close" id="ringClose" aria-label="关闭">×</button>

        <!-- 标题区 -->
        <div class="inherit-ring-modal__header">
          <h3 class="inherit-ring-modal__title" id="ringModalTitle">刻下我的坚持</h3>
          <p class="inherit-ring-modal__subtitle">顺着年轮，刻下那些属于你的时光</p>
        </div>

        <!-- 年轮木板区：底图 + SVG鎏金轨迹 + 文字标注 + 中心印章 + 木屑粒子容器 -->
        <div class="inherit-ring-board" id="ringBoard">
          <div class="inherit-ring-board__inner">
          <img class="inherit-ring-board__img" src="assets/images/inherit/wood_ring_base_clean.jpg" alt="年轮木板" loading="lazy">
          <!-- SVG鎏金轨迹层：viewBox固定300x300，坐标和图片1:1对应
               路径坐标对照wood_ring_base_clean.jpg上实际鎏金弧线位置 -->
          <svg class="inherit-ring-board__svg" id="ringSvg" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet">
            <!-- 鎏金刻线：双层描边实现"刻槽嵌金"效果
                 人话讲：每条线画两遍——底下画一条略粗的深棕色线当凹槽阴影，上面画亮金线当嵌金
                 这比复杂SVG滤镜兼容性好，老旧安卓也能正常显示
                 新手易错：底层线要比上层粗1-2px，颜色要深，否则出不来凹槽立体感 -->
            <defs>
              <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="0.8" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <!-- 刻槽阴影层（深棕色粗线，在金线下面）-->
            <path class="ring-trace ring-trace--shadow" d="M 188,98 Q 160,130 150,155" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" opacity="0" stroke-linejoin="round"/>
            <path class="ring-trace ring-trace--shadow" d="M 98,192 Q 125,165 150,155" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" opacity="0" stroke-linejoin="round"/>
            <path class="ring-trace ring-trace--shadow" d="M 208,228 Q 180,190 150,155" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" opacity="0" stroke-linejoin="round"/>
            <!-- 用户手动绘制的刻槽阴影层（3条线，每条一个path）-->
            <path id="ringUserTraceShadow1" d="" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
            <path id="ringUserTraceShadow2" d="" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
            <path id="ringUserTraceShadow3" d="" fill="none" stroke="#2a1505" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
            <!-- 亮金主线层（略细，在阴影上面）-->
            <path class="ring-trace ring-trace--gold" d="M 188,98 Q 160,130 150,155" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" opacity="0" filter="url(#ringGlow)"/>
            <path class="ring-trace ring-trace--gold" d="M 98,192 Q 125,165 150,155" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" opacity="0" filter="url(#ringGlow)"/>
            <path class="ring-trace ring-trace--gold" d="M 208,228 Q 180,190 150,155" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" opacity="0" filter="url(#ringGlow)"/>
            <!-- 用户手动绘制的亮金轨迹层（3条线，每条一个path）-->
            <path id="ringUserTrace1" d="" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0" filter="url(#ringGlow)"/>
            <path id="ringUserTrace2" d="" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0" filter="url(#ringGlow)"/>
            <path id="ringUserTrace3" d="" fill="none" stroke="#e8c968" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0" filter="url(#ringGlow)"/>
            <!-- 鎏金标注点：亮金圆点+深色描边，镌刻时逐个亮起 -->
            <circle class="ring-dot ring-dot--start" cx="188" cy="98" r="4.5" fill="#e8c968" stroke="#2a1505" stroke-width="1" opacity="0"/>
            <circle class="ring-dot ring-dot--middle" cx="98" cy="192" r="4.5" fill="#e8c968" stroke="#2a1505" stroke-width="1" opacity="0"/>
            <circle class="ring-dot ring-dot--end" cx="208" cy="228" r="4.5" fill="#e8c968" stroke="#2a1505" stroke-width="1" opacity="0"/>
          </svg>
          <!-- 文字标注：初学/经年/承艺，用百分比定位在木板上 -->
          <span class="ring-label ring-label--start">初学</span>
          <span class="ring-label ring-label--middle">经年</span>
          <span class="ring-label ring-label--end">承艺</span>
          <!-- 木板上的输入提示文字（初始状态显示，开始镌刻后隐藏）-->
          <p class="ring-board-hint" id="ringBoardHint">写下你坚持了很久的一件事</p>
          <!-- 守心印章（完成页弹出，朱砂红竖排印章）-->
          <div class="ring-seal-center" id="ringCenterSeal">守心</div>
          <!-- 镌刻中散落木屑装饰容器（JS动态创建粒子）-->
          <div class="ring-particles" id="ringParticles"></div>
          </div>
        </div>

        <!-- 宣纸输入/展示区：底图宣纸 + 输入框/结果文案 + 时光有痕印章 -->
        <div class="ring-paper-wrap">
          <img class="ring-paper__bg" src="assets/images/inherit/paper_input_box_base_16x9.jpg" alt="" aria-hidden="true">
          <!-- 初始状态：输入框，最多80字 -->
          <textarea class="ring-paper__input" id="ringInput" placeholder="写下你坚持了很久的一件事" rows="2" maxlength="80"></textarea>
          <!-- 完成状态：展示文案 -->
          <p class="ring-paper__result" id="ringResult">
            潮州木雕匠人以刀刻木，耗费半生守望一门手艺；<br>
            你以岁月奔赴心中所爱，<br>
            所有长久的坚持，皆值得被看见。
          </p>
          <!-- 时光有痕印章（右下角朱砂红小章）-->
          <div class="ring-paper__seal">时光<br>有痕</div>
        </div>

        <!-- 提示文字（顺纹雕刻模式时显示操作指引）-->
        <p class="ring-hint" id="ringHint"></p>

        <!-- 初始页按钮：双按钮（一键镌刻 / 顺纹雕刻）-->
        <div class="ring-actions ring-actions--start" id="ringActionsStart">
          <button class="ring-btn" id="btnAutoCarve">一键镌刻 &verbar; 快速体验</button>
          <button class="ring-btn" id="btnManualCarve">顺纹雕刻 &verbar; 亲手沿纹路镌刻</button>
        </div>

        <!-- 完成页按钮：三按钮（保存/复制/返回）-->
        <div class="ring-actions ring-actions--finish" id="ringActionsFinish">
          <button class="ring-btn ring-btn--small" id="btnSaveImage">保存时光木卷</button>
          <button class="ring-btn ring-btn--small" id="btnCopyText">复制分享文案</button>
          <button class="ring-btn ring-btn--small" id="btnBackToPage">返回长卷</button>
        </div>
      </div>
      <!-- 保存图片提示弹层（微信浏览器降级用：提示用户长按保存）-->
      <div class="ring-save-overlay" id="ringSaveOverlay" aria-hidden="true">
        <div class="ring-save-overlay__box">
          <p>长按图片保存到相册</p>
          <img id="ringSaveImg" alt="时光木卷">
          <button class="ring-btn ring-btn--small" id="btnCloseSave">关闭</button>
        </div>
      </div>
      <!-- Toast轻提示（居中显示，自动消失）-->
      <div class="ring-toast" id="ringToast" role="alert"></div>
    </div>

    <!-- ===== 10. 匠语漫行全屏模态 ===== -->
    <div class="jiangyu-modal" id="jiangyuModal" role="dialog" aria-modal="true" aria-label="匠语漫行" aria-hidden="true">
      <!-- 背景图 -->
      <div class="jiangyu-modal__bg"></div>
      <!-- 鎏金光球（提前到第二位置，确保光球在飘字和关闭按钮下层） -->
      <div class="jiangyu-orb" id="jiangyuOrb">
        <span class="jiangyu-orb__text">点击</span>
      </div>
      <!-- 右上角关闭按钮 -->
      <button class="jiangyu-modal__close" id="jiangyuClose" aria-label="关闭">×</button>
      <!-- 飘字区域 -->
      <div class="jiangyu-floating" id="jiangyuFloating"></div>
      <!-- 祝福语弹窗 -->
      <div class="jiangyu-blessing" id="jiangyuBlessing" aria-hidden="true">
        <div class="jiangyu-blessing__overlay"></div>
        <div class="jiangyu-blessing__panel">
          <p class="jiangyu-blessing__text" id="jiangyuBlessingText"></p>
          <button class="jiangyu-blessing__close" id="jiangyuBlessingClose">关闭</button>
        </div>
      </div>
    </div>

    <!-- ===== 11. 木屑粒子容器 ===== -->
    <div class="inherit-particles" id="particlesContainer"></div>

    <!--
      新手易错点：preload="none" 避免页面加载时请求不存在的文件产生 404。
      验证：F12 Network 面板刷新页面，不应出现 guqin-loop.mp3 的 404 请求。
    -->
    <!-- ===== 12. 底部固定全局导航栏（复用 style.css 的 .bottom-nav） ===== -->
    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 10.3 12 3.6l8.5 6.7"/>
            <path d="M5.2 9.7v10.1a1 1 0 0 0 1 1h11.6a1 1 0 0 0 1-1V9.7"/>
            <path d="M10 20.8v-5.2h4v5.2"/>
          </svg>
        </span>
        <span class="bottom-nav__label">首页</span>
      </a>

      <a href="history.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4.2h10.4a2 2 0 0 1 2 2v12.3a1.5 1.5 0 0 0 1.5 1.5H8a2 2 0 0 1-2-2Z"/>
            <path d="M6 4.2A2 2 0 0 0 4 6.2v1.7h2"/>
            <path d="M9.3 9h5.2M9.3 13h5.2"/>
          </svg>
        </span>
        <span class="bottom-nav__label">历史</span>
      </a>

      <a href="inherit.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8.5" cy="8.2" r="2.8"/>
            <path d="M3.4 19.8c.5-3.3 2.7-5.4 5.1-5.4s4.6 2.1 5.1 5.4"/>
            <circle cx="16.8" cy="9.2" r="2.3"/>
            <path d="M14.4 19.8c.3-2.1 1.7-3.8 4-4.1"/>
          </svg>
        </span>
        <span class="bottom-nav__label">传承</span>
      </a>

      <a href="ai.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8.4" y="3.3" width="7.2" height="11.2" rx="3.6"/>
            <path d="M5.4 11c0 3.7 2.8 6.3 6.6 6.3s6.6-2.6 6.6-6.3"/>
            <path d="M12 17.5V21"/>
            <path d="M9.2 21h5.6"/>
          </svg>
        </span>
        <span class="bottom-nav__label">AI</span>
      </a>
    </nav>

  </div>

  <!-- 引入全站公共工具函数（escapeHtml、safeColor），必须在内联脚本之前加载 -->
  <script src="js/common.js"></script>
  <script src="js/inherit-data.js"></script>
  <script src="js/inherit-page.js"></script>
</body>
</html>
