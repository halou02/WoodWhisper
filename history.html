<!DOCTYPE html>
<!--
  这个文件是：潮州木雕·数智非遗传承 H5 网站 → 历史脉络页 (history.html)
  在干什么：用横向鎏金时间轴展示唐→宋→明→清→近现代的木雕演变，
            点击朝代节点切换上方展品拼图和下方文字卡片内容。
  素材来源：仅使用本地实拍照片，不生成AI图片。
  架构：MPA 多页面，底部固定导航栏，内嵌 CSS + Vanilla JS。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：适配刘海屏手机，让页面铺满整个屏幕 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="循着唐、宋、明、清至近现代的时间轴，浏览潮州木雕的工艺演进、代表展品与传承故事。">
  <title>历史脉络 · 潮州木雕</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div class="history-page" id="historyPage">

    <!-- ===== 顶部固定标题栏 ===== -->
    <header class="history-header">
      <div class="history-header__titles">
        <h1 class="history-header__title">历史脉络</h1>
        <p class="history-header__subtitle">光影中的木雕演变</p>
      </div>
      <div class="history-header__actions">
        <!-- 月亮按钮：明暗展厅切换 -->
        <button class="history-header__btn" id="darkModeBtn" aria-label="切换展厅模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== 主内容区 ===== -->
    <main class="history-main">

      <!-- 展品拼图模块 -->
      <section class="gallery" id="gallery" aria-label="展品拼图">
        <div class="gallery__grid" id="galleryGrid">
          <!-- JS 动态渲染 -->
        </div>
      </section>

      <!-- 横向鎏金时间轴 -->
      <nav class="timeline-bar" id="timelineBar" aria-label="朝代时间轴">
        <div class="timeline-bar__line"></div>
        <!-- JS 动态渲染节点 -->
      </nav>

      <!-- 宣纸文字卡片 -->
      <article class="dynasty-card-wrapper" id="dynastyCardWrapper">
        <div class="dynasty-card__scroll" id="dynastyCardScroll">
          <div class="dynasty-card__header">
            <h2 class="dynasty-card__name" id="dynastyName"></h2>
            <span class="dynasty-card__year" id="dynastyYear"></span>
          </div>
          <div id="dynastyTextBody">
            <!-- JS 渲染三段式正文 -->
          </div>
        </div>
        <div class="dynasty-card__footer">
          <button class="dynasty-card__speak" id="speakBtn" aria-label="点击听讲解">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 5L6 9H2v6h4l5 4V5z"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <span>点击听讲解</span>
          </button>
          <div class="dynasty-card__seal" id="dynastySeal" aria-label="长按查看拓展史料">
            <span>雕</span>
          </div>
        </div>
      </article>

    </main>

    <!-- ===== 全屏弹窗 ===== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" aria-hidden="true">
      <span class="sr-only" id="lightboxTitle">展品图片预览</span>
      <button class="lightbox__close" id="lightboxClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img class="lightbox__img" id="lightboxImg" src="" alt="">
    </div>

    <!-- ===== 拓展史料气泡 ===== -->
    <div class="trivia-bubble" id="triviaBubble" aria-hidden="true"></div>

    <!-- ===== 微粒容器 ===== -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- ===== 底部固定导航栏（与全站共用结构） ===== -->
    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 10.3 12 3.6l8.5 6.7"/>
            <path d="M5.2 9.7v10.1a1 1 0 0 0 1 1h11.6a1 1 0 0 0 1-1V9.7"/>
            <path d="M10 20.8v-5.2h4v5.2"/>
          </svg>
        </span>
        <span class="bottom-nav__label">首页</span>
      </a>

      <a href="history.html" class="bottom-nav__item bottom-nav__item--active" aria-current="page">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 4.2h10.4a2 2 0 0 1 2 2v12.3a1.5 1.5 0 0 0 1.5 1.5H8a2 2 0 0 1-2-2Z"/>
            <path d="M6 4.2A2 2 0 0 0 4 6.2v1.7h2"/>
            <path d="M9.3 9h5.2M9.3 13h5.2"/>
          </svg>
        </span>
        <span class="bottom-nav__label">历史</span>
      </a>

      <a href="inherit.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="8.5" cy="8.2" r="2.8"/>
            <path d="M3.4 19.8c.5-3.3 2.7-5.4 5.1-5.4s4.6 2.1 5.1 5.4"/>
            <circle cx="16.8" cy="9.2" r="2.3"/>
            <path d="M14.4 19.8c.3-2.1 1.7-3.8 4-4.1"/>
          </svg>
        </span>
        <span class="bottom-nav__label">传承</span>
      </a>

      <a href="ai.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8.4" y="3.3" width="7.2" height="11.2" rx="3.6"/>
            <path d="M5.4 11c0 3.7 2.8 6.3 6.6 6.3s6.6-2.6 6.6-6.3"/>
            <path d="M12 17.5V21"/>
            <path d="M9.2 21h5.6"/>
          </svg>
        </span>
        <span class="bottom-nav__label">AI</span>
      </a>
    </nav>

  </div>

  <!-- 引入全站公共工具函数（escapeHtml等），必须在内联脚本之前加载 -->
  <script src="js/common.js"></script>
  <script src="js/history-data.js"></script>
  <script>
    /* ============================================================
     * 历史脉络页 JS（纯原生，无框架）
     * 架构：数据层(DYNASTIES) → 渲染层 → 交互层
     * 分层解耦：数据层 / 渲染层 / 交互层 分离
     * ============================================================ */

    // ===== 【数据层】5 个朝代的完整数据 =====
    // 人话讲：这里就是"菜谱"，每个朝代一道菜，包含名字、年份、正文、图片、彩蛋 trivia。
    // 新手易错点：图片路径相对于 history.html 的位置——本文件在项目根目录，
    //   图片在 assets/images/history/历史页UI元素参考/ 里，所以路径是 "assets/images/history/历史页UI元素参考/xxx"。

    // ===== 【状态层】当前激活的朝代索引、音乐开关、暗色模式 =====
    let currentIndex = 0;
    let isDarkMode = false;
    let longPressTimer = null;
    // 切换动画锁：防止 400ms 淡入淡出期间用户快速连点导致最终显示错乱
    // 人话讲：就像电梯门正在关时你狂按楼层，得等门关了再响应下一次，不然会乱。
    let isSwitching = false;

    // ===== 【DOM 引用】预先抓取，避免重复查询 =====
    const page = document.getElementById('historyPage');
    const gallery = document.getElementById('gallery');
    const galleryGrid = document.getElementById('galleryGrid');
    const timelineBar = document.getElementById('timelineBar');
    const dynastyName = document.getElementById('dynastyName');
    const dynastyYear = document.getElementById('dynastyYear');
    const dynastyTextBody = document.getElementById('dynastyTextBody');
    const dynastyCardWrapper = document.getElementById('dynastyCardWrapper');
    const dynastyCardScroll = document.getElementById('dynastyCardScroll');
    const speakBtn = document.getElementById('speakBtn');
    const dynastySeal = document.getElementById('dynastySeal');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const triviaBubble = document.getElementById('triviaBubble');
    const particlesContainer = document.getElementById('particlesContainer');
    const darkModeBtn = document.getElementById('darkModeBtn');
    let lastLightboxTrigger = null;

    // ===== 【渲染层】初始化时间轴节点 =====
    function renderTimeline() {
      // 清空已有节点（防止重复渲染）
      const existingNodes = timelineBar.querySelectorAll('.timeline-bar__node');
      existingNodes.forEach(n => n.remove());

      DYNASTIES.forEach((d, i) => {
        const node = document.createElement('div');
        node.className = 'timeline-bar__node' + (i === 0 ? ' active' : '');
        node.dataset.index = String(i);
        // 使用 escapeHtml 防止 XSS 攻击
        node.innerHTML = '<div class="timeline-bar__dot"></div><span class="timeline-bar__label">' + escapeHtml(d.name) + '</span>';
        // 直接给节点绑点击：比事件委托更稳，移动端某些浏览器对 absolute 覆盖层的 click 委托不敏感
        // 先清空再绑定，防止 renderTimeline 被重复调用时叠加多次
        // 同时监听 touchend，确保手机上手指抬起时立刻响应，不用等 300ms click 延迟
        node.onclick = null;
        node.ontouchend = null;
        node.onclick = function () { switchDynasty(i); };
        node.ontouchend = function (e) {
          // 防止 touchend 继续冒泡成 click 导致重复切换
          e.preventDefault();
          switchDynasty(i);
        };
        timelineBar.appendChild(node);
      });

      console.log('[初始化] 时间轴节点已渲染，共', DYNASTIES.length, '个');
    }

    // ===== 【渲染层】渲染展品拼图 =====
    function renderGallery(index) {
      const dynasty = DYNASTIES[index];
      galleryGrid.innerHTML = '';
      dynasty.images.forEach(src => {
        const picture = document.createElement('picture');
        picture.className = 'gallery__picture';
        const source = document.createElement('source');
        source.type = 'image/webp';
        const imageName = src.split('/').pop().replace(/\.[^.]+$/, '');
        source.srcset = 'assets/images/history/optimized/' + imageName + '.webp';
        const img = document.createElement('img');
        img.className = 'gallery__item';
        img.src = 'assets/images/history/optimized/' + imageName + '.jpg';
        img.alt = dynasty.name + '代木雕展品';
        img.tabIndex = 0;
        // 首屏展品图直接加载，避免 lazy 在部分浏览器/弱网时不触发导致裂图
        // 新手易错点：首屏关键内容加 loading='lazy'，会让浏览器觉得"不着急加载"，
        //   用户可能先看到空白或裂图。非首屏/屏外大图才适合懒加载。
        //   验证：Network 面板里这几个 img 请求应在 DOMContentLoaded 后不久就出现。
        img.onerror = function () {
          // 图片加载失败时，不显示浏览器默认裂图，而是用一个 div 占位显示朝代名
          // 新手易错点：<img> 是"替换元素"，给它设 textContent/flex 浏览器不会渲染，
          //   必须用 div 这种"非替换元素"才能显示文字。
          //   验证：把某张图片路径故意改错，刷新后应看到"XX展品暂缺"文字，而不是裂图或空白。
          const placeholder = document.createElement('div');
          placeholder.className = 'gallery__item';
          placeholder.textContent = dynasty.name + '展品暂缺';
          placeholder.style.display = 'flex';
          placeholder.style.alignItems = 'center';
          placeholder.style.justifyContent = 'center';
          placeholder.style.background = '#C9B896';
          placeholder.style.color = '#5C4033';
          placeholder.style.fontSize = '14px';
          placeholder.style.textAlign = 'center';
          placeholder.style.borderRadius = '14px';
          picture.replaceWith(placeholder);
        };
        picture.appendChild(source);
        picture.appendChild(img);
        galleryGrid.appendChild(picture);
      });
    }

    // ===== 【渲染层】渲染朝代卡片文字 =====
    function renderDynastyCard(index) {
      const d = DYNASTIES[index];
      dynastyName.textContent = d.name;
      dynastyYear.textContent = d.year;
      // 使用 escapeHtml 防止 XSS 攻击
      dynastyTextBody.innerHTML = d.texts.map((t, i) =>
        (i > 0 ? '<div class="dynasty-card__divider"></div>' : '') + '<p class="dynasty-card__text">' + escapeHtml(t) + '</p>'
      ).join('');
      // 重置滚动位置
      dynastyCardScroll.scrollTop = 0;
    }

    // ===== 【交互层】切换朝代 =====
    function switchDynasty(index) {
      // 同一朝代或动画进行中时不响应，防止连点导致状态错乱
      if (index === currentIndex || isSwitching) return;
      isSwitching = true;
      // 淡出拼图
      gallery.classList.add('fade-out');
      setTimeout(() => {
        currentIndex = index;
        renderGallery(index);
        renderDynastyCard(index);
        // 更新 active 节点
        updateActiveNode(index);
        // 飘落微粒
        spawnParticles(DYNASTIES[index].particle);
        // 淡入拼图
        gallery.classList.remove('fade-out');
        isSwitching = false;
      }, 400);
    }

    function updateActiveNode(index) {
      const nodes = timelineBar.querySelectorAll('.timeline-bar__node');
      nodes.forEach((n, i) => {
        n.classList.toggle('active', i === index);
      });
    }

    // ===== 【微粒动画】飘落对应朝代透明纹样微粒 =====
    function spawnParticles(char) {
      for (let i = 0; i < 6; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = char;
        p.style.left = (15 + Math.random() * 70) + '%';
        p.style.top = (30 + Math.random() * 20) + '%';
        p.style.animationDelay = (Math.random() * 0.8) + 's';
        p.style.fontSize = (14 + Math.random() * 8) + 'px';
        particlesContainer.appendChild(p);
        // 动画结束后移除
        setTimeout(() => p.remove(), 3000);
      }
    }

    // ===== 【语音朗读】浏览器原生 TTS =====
    function speakCurrentDynasty() {
      const d = DYNASTIES[currentIndex];
      const fullText = d.name + '，' + d.year + '。' + d.texts.join('');
      if ('speechSynthesis' in window) {
        // 停止之前的朗读
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.pitch = 1;
        // 朗读时添加微光效果
        page.classList.add('speaking');
        utterance.onend = () => page.classList.remove('speaking');
        utterance.onerror = () => page.classList.remove('speaking');
        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的浏览器不支持语音朗读功能');
      }
    }

    // ===== 【Lightbox】全屏弹窗 + 双指缩放 =====
    let currentScale = 1;
    let initialDistance = 0;

    function openLightbox(src, trigger) {
      lastLightboxTrigger = trigger || null;
      lightboxImg.src = src.replace(/\.[^.]+$/, '.jpg');
      lightbox.classList.add('visible');
      lightbox.setAttribute('aria-hidden', 'false');
      currentScale = 1;
      lightboxImg.style.transform = 'scale(1)';
      lightboxClose.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('visible');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImg.src = '';
      currentScale = 1;
      if (lastLightboxTrigger) lastLightboxTrigger.focus();
    }

    // 关闭按钮点击
    const lightboxClose = document.getElementById('lightboxClose');
    if (lightboxClose) {
      lightboxClose.addEventListener('click', closeLightbox);
    }

    // ESC 键关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('visible')) {
        closeLightbox();
      }
    });

    // 双指缩放逻辑（简化版：两指距离变化 → scale）
    let touches = [];
    let isPinching = false;
    
    lightboxImg.addEventListener('touchstart', (e) => {
      touches = Array.from(e.touches);
      if (touches.length === 2) {
        e.preventDefault(); // 双指操作时阻止默认行为
        isPinching = true;
        initialDistance = Math.hypot(
          touches[0].clientX - touches[1].clientX,
          touches[0].clientY - touches[1].clientY
        );
      }
    }, { passive: false });

    lightboxImg.addEventListener('touchmove', (e) => {
      if (!isPinching) return; // 单指操作不处理
      
      e.preventDefault();
      touches = Array.from(e.touches);
      if (touches.length === 2) {
        const dist = Math.hypot(
          touches[0].clientX - touches[1].clientX,
          touches[0].clientY - touches[1].clientY
        );
        const ratio = dist / initialDistance;
        currentScale = Math.min(Math.max(ratio, 1), 3);
        lightboxImg.style.transform = 'scale(' + currentScale + ')';
      }
    }, { passive: false });
    
    lightboxImg.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
      }
    });

    // 下滑关闭
    let touchStartY = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    });
    lightbox.addEventListener('touchend', (e) => {
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (dy > 80) closeLightbox();
    });

    // 单击关闭（非缩放操作时）
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // ===== 【长按彩蛋】印章长按 2 秒弹出拓展史料 =====
    function startLongPress() {
      longPressTimer = setTimeout(() => {
        const d = DYNASTIES[currentIndex];
        triviaBubble.textContent = d.trivia;
        triviaBubble.classList.add('visible');
        triviaBubble.setAttribute('aria-hidden', 'false');
      }, 2000);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      triviaBubble.classList.remove('visible');
      triviaBubble.setAttribute('aria-hidden', 'true');
    }

    dynastySeal.addEventListener('touchstart', startLongPress);
    dynastySeal.addEventListener('touchend', cancelLongPress);
    dynastySeal.addEventListener('touchcancel', cancelLongPress);
    // 鼠标兼容（桌面调试用）
    dynastySeal.addEventListener('mousedown', startLongPress);
    dynastySeal.addEventListener('mouseup', cancelLongPress);
    dynastySeal.addEventListener('mouseleave', cancelLongPress);

    // ===== 【明暗模式】右上角月亮按钮切换 =====
    darkModeBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      page.classList.toggle('dark', isDarkMode);
    });

    // ===== 【展品点击图片】 =====
    galleryGrid.addEventListener('click', (e) => {
      if (e.target.classList.contains('gallery__item')) {
        openLightbox(e.target.src, e.target);
      }
    });
    galleryGrid.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('gallery__item')) {
        e.preventDefault();
        openLightbox(e.target.src, e.target);
      }
    });

    // ===== 【语音按钮】 =====
    speakBtn.addEventListener('click', speakCurrentDynasty);

    // ===== 【初始化渲染】默认显示唐朝 =====
    renderTimeline();
    renderGallery(0);
    renderDynastyCard(0);

    // 新手验证提示：打开控制台输入以下命令验证
    // console.log('朝代数量:', DYNASTIES.length);       // 应为 5
    // console.log('当前索引:', currentIndex);             // 应为 0（唐）
    // console.log('时间轴节点数:', timelineBar.querySelectorAll('.timeline-bar__node').length); // 应为 5
    // console.log('拼图图片数:', galleryGrid.children.length); // 应为 4
  </script>
</body>
</html>
